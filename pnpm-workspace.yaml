packages:
  - "apps/*"
  - "packages/*"

# Both ship platform-native binaries and need their install scripts to run.
allowBuilds:
  '@swc/core': true
  esbuild: true

# Keep versions of cross-cutting deps aligned across every workspace package.
catalog:
  typescript: ^6.0.3
  zod: ^4.5.4
  "@types/node": ^26.4.0
  tsx: ^4.23.13
  vitest: ^4.1.11

# drizzle-kit still pulls the deprecated @esbuild-kit loader, which pins an
# esbuild old enough to carry GHSA-67mh-4wv8-2f99 — a dev-server request
# forgery that drizzle-kit never exposes, since it only ever transpiles a
# config file. There is no fixed drizzle-kit to upgrade to, so the transitive
# copy is forced forward rather than left in the tree carrying an advisory.
overrides:
  esbuild@<0.24.3: ^0.28.2

minimumReleaseAgeExclude:
  - '@duckdb/node-api@1.5.5-r.4'
  - '@duckdb/node-bindings-darwin-arm64@1.5.5-r.4'
  - '@duckdb/node-bindings-darwin-x64@1.5.5-r.4'
  - '@duckdb/node-bindings-linux-arm64-musl@1.5.5-r.4'
  - '@duckdb/node-bindings-linux-arm64@1.5.5-r.4'
  - '@duckdb/node-bindings-linux-x64-musl@1.5.5-r.4'
  - '@duckdb/node-bindings-linux-x64@1.5.5-r.4'
  - '@duckdb/node-bindings-win32-arm64@1.5.5-r.4'
  - '@duckdb/node-bindings-win32-x64@1.5.5-r.4'
  - '@duckdb/node-bindings@1.5.5-r.4'
